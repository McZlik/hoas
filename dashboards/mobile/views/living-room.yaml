type: masonry
path: living-room
title: Living Room
icon: mdi:sofa
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: back
      - type: entity
        entity: sensor.living_room_temperature_temperature
        use_entity_picture: false
        icon: mdi:thermometer
      - type: light
        entity: light.living_room_dimmer
        icon: mdi:ceiling-light
        use_light_color: false
      - type: light
        entity: light.tv_corner_light
        icon: mdi:floor-lamp
        use_light_color: true
      - type: light
        entity: light.dining_room_dimmer
        icon: mdi:ceiling-light-multiple
        use_light_color: false
      - type: light
        entity: switch.kitchen_plant_switch
        icon: mdi:flower
        use_light_color: false
#  - type: custom:advanced-camera-card
#    cameras:
#      - camera_entity: camera.living
  - type: horizontal-stack
    cards:
      - type: custom:mini-graph-card
        name: Temperature
        entities:
          - entity: sensor.living_room_temperature_temperature
            name: Temperature
        show:
          fill: true
        hours_to_show: 12
        points_per_hour: 2
      - type: custom:mini-graph-card
        name: Humidity
        entities:
          - entity: sensor.living_room_temperature_humidity
            name: Humidity
        show:
          fill: true
        hours_to_show: 12
        points_per_hour: 2
        line_color: blue
  - type: thermostat
    entity: climate.living_room_thermostat
  - square: false
    type: grid
    cards:
      - type: custom:mushroom-light-card
        entity: light.living_room_dimmer
        icon: mdi:sofa
        name: Living Room
        show_brightness_control: true
        show_color_control: false
        use_light_color: false
        collapsible_controls: true
      - type: custom:mushroom-light-card
        entity: light.tv_corner_light
        icon: mdi:sofa
        name: TV Corner
        show_brightness_control: true
        show_color_control: true
        use_light_color: true
        collapsible_controls: true
      - type: custom:mushroom-light-card
        entity: light.dining_room_dimmer
        icon: mdi:table-furniture
        name: Dining Room
        show_brightness_control: true
        collapsible_controls: true
      - type: custom:mushroom-light-card
        entity: light.kitchen_plant_light
        icon: mdi:flower
        name: Kitchen Plant
        show_brightness_control: false
        collapsible_controls: true
    fill_container: true
    columns: 2
    title: Lights
  - type: custom:mushroom-light-card
    entity: light.ground_floor_lights
    icon: mdi:lamps
    name: Ground Floor Lights
    fill_container: false
    layout: horizontal
subview: true