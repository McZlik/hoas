    chips:
      - type: back
  - type: vertical-stack
    cards:
      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.driveway_fluent
      - type: custom:mushroom-entity-card
        entity: binary_sensor.driveway_motion
